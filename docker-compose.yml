services:
  # El motor de Base de Datos para almacenar las gestiones limpias
  db:
    image: postgres:15-alpine
    container_name: central_etl_postgres
    restart: always
    environment:
      POSTGRES_DB: central_etl_db
      POSTGRES_USER: etl_admin
      POSTGRES_PASSWORD: etl_password_segura_2026
      TZ: America/Santiago
    ports:
      - "5433:5432"
    volumes:
      - postgres_multimandante_data:/var/lib/postgresql/data
      # Ancla el reloj al hardware del servidor (Solo lectura)
      - /etc/localtime:/etc/localtime:ro 

  # El entorno de Python donde correrá tu Robot Enterprise y la API
  app:
    build: ./backend
    container_name: central_etl_app
    restart: always
    ports:
      - "9090:5000"
    volumes:
      - ./backend:/app
      # Ancla el reloj al hardware del servidor (Solo lectura)
      - /etc/localtime:/etc/localtime:ro 
    environment:
      - DB_HOST=db
      - DB_NAME=central_etl_db
      - DB_USER=etl_admin
      - DB_PASSWORD=etl_password_segura_2026
      - DB_PORT=5432
      - TZ=America/Santiago
    depends_on:
      - db

  # Tu entorno Frontend en Vue.js (Mudado al puerto 8088)
  frontend:
    build: ./frontend
    container_name: central_etl_vue
    restart: always
    environment:
      - TZ=America/Santiago
    ports:
      - "8088:8088"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Ancla el reloj al hardware del servidor (Solo lectura)
      - /etc/localtime:/etc/localtime:ro 
    depends_on:
      - app

volumes:
  postgres_multimandante_data: