<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Central ETL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-lg" style="width: 350px; border-radius: 10px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold">Central ETL</h4>
            <p class="text-muted small">Panel Multi-Mandante</p>
        </div>
        
        <!-- Alertas de error -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger py-2 text-center small fw-bold">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control bg-light" required placeholder="Ej: admin1">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control bg-light" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Ingresar al Motor</button>
        </form>
    </div>
</body>
</html>
